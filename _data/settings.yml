#-------------------------------
# Blog Composer Login (soft client-side gate)
# NOTE: Static site — this is NOT real authentication. Only SHA-256 hashes of
# the credentials are stored, never plaintext. It gates a local post composer
# that exports a .md file for you to commit; it cannot publish on its own.
# To change credentials:  printf 'value' | shasum -a 256
blog_login:
  enable: true
  username_hash: 'e53b40f6c4a7449503a892d51275ae5a06356f84d354be8610e864add3e7ff70'
  password_hash: 'dc2ee521c7b4ea99d986e81943f544268bc4a7496a235aaac475b1be93b95b9f'


#-------------------------------
# PIN Lock (front-end gate for protected pages)
# NOTE: This is a soft gate for a static site — it deters casual visitors but
# is NOT real security (the page HTML still ships to the browser). Only the
# SHA-256 hash of the PIN is stored here, never the raw digits.
# To change the PIN, run:  printf 'YOURPIN' | shasum -a 256
pin_lock:
  enable: true
  hash: 'dc2ee521c7b4ea99d986e81943f544268bc4a7496a235aaac475b1be93b95b9f'


#-------------------------------
# Author Settings
author:
  author_name: Addison Lin
  author_role: CS Undergraduate at University of Oklahoma
  author_bio: |
    Hello friends, welcome to my personal corner of the internet. I enjoy building with code, playing on the tennis court, traveling the world, and discovering the best food wherever I go.

    Zhou Xun (周迅) once said:
    "Time is incredibly precious — don’t waste it on things that don’t matter. Live in the present, and occasionally look ahead. The second that just passed is already eternity."

    Whenever I witness something beautiful happening, I wish time could stand still.
  author_avatar: '/images/addison-lin-profile.jpg'

  # Homepage intro — structured so it renders as a designed block, not a flat paragraph
  author_intro: Hello friends, welcome to my personal corner of the internet. Whenever I witness something beautiful happening, I wish time could stand still.
  author_interests:
    - { icon: 'fa-solid fa-code', label: 'Building with code' }
    - { icon: 'fa-solid fa-table-tennis-paddle-ball', label: 'On the tennis court' }
    - { icon: 'fa-solid fa-plane', label: 'Traveling the world' }
    - { icon: 'fa-solid fa-utensils', label: 'Chasing good food' }
  author_quote: Time is incredibly precious — don’t waste it on things that don’t matter. Live in the present, and occasionally look ahead. The second that just passed is already eternity.
  author_quote_source: Zhou Xun (周迅)

  cta_button_text: Get In Touch
  cta_button_link: '/contact/'


